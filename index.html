<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Pollo Loco</title>
  <link rel="icon" href="assets/img/6_salsa_bottle/salsa_bottle.png" type="image/x-icon">

  <link rel="stylesheet" href="style.css">

  <script src="models/drawable_object.class.js"></script>
  <script src="models/moveable_object.class.js"></script>
  
  <script src="models/status_bar.class.js"></script>
  <script src="models/status_bar_health.class.js"></script>
  <script src="models/status_bar_coin.class.js"></script>
  <script src="models/status_bar_salsa_bottle.class.js"></script>
  <script src="models/status_bar_endboss.class.js"></script>
  <script src="models/character.class.js"></script>
  <script src="models/chicken.class.js"></script>
  <script src="models/cloud.class.js"></script>
  <script src="models/endboss.class.js"></script>
  <script src="models/salsa_bottle.class.js"></script>
  <script src="models/coin.class.js"></script>
  <script src="models/small_chicken.class.js"></script>
  <script src="models/world.class.js"></script>
  <script src="models/background_objects.class.js"></script>
  <script src="models/level.class.js"></script>
  <script src="models/keyboard.class.js"></script>
  <script src="models/throwable_object.class.js"></script>
  <script src="scripts/level1.js"></script>
  <script src="script.js"></script>
  
</head>
<body onload="init()" oncontextmenu="return true">
  <main>
    <div id="settingsContainer" class="settings_container">
      <div onclick="toggleVolume()" id="soundBtn" class="btn">
        <img id="volumeBtn" src="assets/img/menu_description/volume_up.svg" alt="Volume Icon">
      </div>

      <div onclick="playGame()" id="playBtn" class="btn">
        Play Now
      </div>

      <div onclick="toggleKeyboardInstruction(event)" class="btn">
        <img id="keyboardBtn" src="assets/img/menu_description/keyboard.svg" alt="Keyboard Icon">
      </div>

      <div onclick="toggleKeyboardInstruction(event)" id="keyboardBtnInfo" class="keyboard_info">
        <div onclick="event.stopPropagation()" class="instructions_modal">
          <h1>Keyboard Instructions</h1>  
          <div class="instructions_container">
            <div class="instructions">
              <div class="instruction_key">
                <i>Press</i>
                <img src="assets/img/menu_description/arrow_right.svg" alt="Right Arrow"> <i>or</i>
                <img src="assets/img/menu_description/key_d.svg" alt="D Key"> <i>to</i>
              </div>
                <div class="instruction_outcome">
                <span>Move Right</span>
              </div>
            </div>
            
            <div class="instructions">
              <div class="instruction_key">
                <i>Press</i>
                <img src="assets/img/menu_description/arrow_left.svg" alt="Left Arrow"> <i>or</i>
                <img src="assets/img/menu_description/key_a.svg" alt="A Key"> <i>to</i>
              </div>
              <div class="instructions_outcome">
                <span>Move Left</span>
              </div>
            </div>
            
            <div class="instructions">
              <div class="instruction_key">
                <i>Press</i>
                <img src="assets/img/menu_description/arrow_upward.svg" alt="Up Arrow"> <i>or</i>
                <img src="assets/img/menu_description/space_bar.svg" alt="Space Bar"> <i>or</i>
                <img src="assets/img/menu_description/key_w.svg" alt="W Key"> <i>to</i>
              </div>
            <div class="instruction_outcome">
              <span>Jump</span>
            </div>
            </div>
          
            <div class="instructions">
              <div class="instruction_key">
                <i>Press</i>
                <img src="assets/img/menu_description/key_q.svg" alt="Q Key"> <i>to</i>
              </div>
              <div class="instruction_outcome">
                <span>Throw bottle</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div onclick="toggleFullscreen()" id="fullscreenBtn" class="btn d_none">
        <img id="volumeBtn" src="assets/img/menu_description/fullscreen.svg" alt="Volume Icon">
      </div>
    </div>

    
    <div id="menu">
      <img src="assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="Start Screen">
    </div>
    
    <div id="fullscreen" class="d_none">
      <canvas id="canvas" class="d_none" height="480" width="720">
      </canvas>

      <div id="mobileBtn" class="mobile_btn_container d_none">
        <div class="mobile_btn_left">
          <button id="mobileBtnLeft">
            <img src="assets/img/menu_description/mobile_arrow_left.svg" alt="Arrow left">
          </button>
          <button id="mobileBtnRight">
            <img src="assets/img/menu_description/mobile_arrow_right.svg" alt="Arrow right">
          </button>
        </div>
        <div class="mobile_btn_right">
          <button id="mobileBtnThrow">
            <img src="assets/img/menu_description/mobile_btn_bottle.svg" alt="Bottle Icon">
          </button>
          <button id="mobileBtnJump">
            <img src="assets/img/menu_description/mobile_arrow_upward.svg" alt="Arrow up">
          </button>
        </div>
      </div>
      
      <div id="youWin" class="d_none">
        <img src="assets/img/You won, you lost/You Win A.png" alt="Game win screen">
      </div>
  
      <div id="youLost" class="d_none">
        <img src="assets/img/You won, you lost/You lost.png" alt="You lost screen">
      </div>
    </div>


    <div id="endgameBtns" class="endgame_btns d_none">
      <button id="restartGame" onclick="restartGame()" class="restart_btn btn">Restart</button>
      <button id="goBackToMenu" onclick="goBackToMenu()" class="go_back_to_menu btn">Go back to menu</button>
    </div>

    <div class="rotate_phone" id="rotatePhone">
      <img src="assets/img/menu_description/rotate_phone.png" alt="Rotate phone image">
      <p>Please rotate your phone.</p>
    </div>

  </main>

</body>
</html>
